# Configure, build and run the test suite the way the dev container does.
#
# The job ends in `ctest`, not in `cmake --build`. This project is a thread
# pool behind a priority queue: whether it compiles says almost nothing, and
# whether its tests pass says almost everything.
#
# The toolchain mirrors .devcontainer/Dockerfile (GCC 15) and the dependency
# comes from conanfile.py with the settings of .devcontainer/default. Conan is
# not optional here even though the container also has libgtest-dev from apt:
# the linux-default preset points CMAKE_TOOLCHAIN_FILE at
# build/Debug/generators/conan_toolchain.cmake, which only `conan install`
# writes.
#
# scripts/check_before_push.py runs exactly these steps locally.

name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC 15 / Conan / Debug
    runs-on: ubuntu-latest
    # A deadlocked test would otherwise hold a runner for six hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # GCC 15 is what .devcontainer/Dockerfile installs. Ubuntu 24.04, which
      # is what ubuntu-latest currently is, has no g++-15 in the archive, so
      # the toolchain PPA supplies it. The apt attempt comes first so that the
      # PPA drops out of the picture by itself once the runner image moves to a
      # release that ships GCC 15.
      - name: Install GCC 15
        run: |
          set -eux
          sudo apt-get update
          if ! sudo apt-get install -y --no-install-recommends g++-15 gcc-15; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends g++-15 gcc-15
          fi
          sudo apt-get install -y --no-install-recommends ccache
          g++-15 --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: pip install "conan>=2,<3"

      - name: Restore the Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-linux-gcc15-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-linux-gcc15-

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-gcc15-${{ github.sha }}
          restore-keys: |
            ccache-linux-gcc15-

      # Same settings as .devcontainer/default, except build_type: the
      # linux-default preset configures Debug, so Conan has to generate the
      # dependency files for Debug or find_package would come up empty.
      - name: Install the dependencies
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          set -eux
          conan profile detect --force
          conan install . \
            -s build_type=Debug \
            -s compiler=gcc \
            -s compiler.version=15 \
            -s compiler.cppstd=23 \
            -s compiler.libcxx=libstdc++11 \
            --build=missing

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --preset linux-default -D CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-default

      - name: Test
        run: ctest --preset linux-default

  # A second platform is only worth having if it is dependable. This project's
  # only dependency is GTest, so the Windows job is a compiler, Conan and
  # nothing else - cheap enough to be worth running and with little left to be
  # flaky about. It runs the repository's own scripts/build_windows.ps1, the
  # same entry point a developer uses on Windows, which imports the MSVC
  # environment, installs the dependencies, configures the windows-msvc-release
  # preset, builds, and runs ctest.
  windows:
    name: Windows / MSVC / Release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The preset uses the Ninja generator. Visual Studio ships a ninja, but
      # only with an optional component and not on PATH, so it is installed
      # explicitly rather than hoped for.
      - name: Install Conan and Ninja
        run: pip install "conan>=2,<3" ninja

      - name: Restore the Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-windows-msvc-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-windows-msvc-

      - name: Build and test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1
